<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self';img-src 'self' blob:;media-src blob:;connect-src 'none';object-src 'none';frame-src 'none'"><title>BMW 素材库</title><link rel="stylesheet" href="library.css"></head>
<body><header class="heading"><div><h1>素材库</h1><p id="collection-context">所有 Project 的已保存素材，在这里汇总。</p></div><button id="collect">去浏览器收集 ↗</button><button id="refresh">刷新</button><button id="recover" hidden>恢复复制清理</button><button id="cancel">停止当前操作</button></header>
<div class="workspace"><aside class="sidebar"><nav id="categories" aria-label="素材分类"><button data-category="all" aria-pressed="true">全部素材</button><button data-category="work">成品</button><button data-category="topics">项目专题</button><button data-category="directions">关注方向</button><button data-category="source-stream">来源流</button><button data-category="event-stream">事件记录</button><button data-category="subscriptions">来源订阅</button><button data-category="schedules">周期采集与健康</button><button data-category="collection-runs">采集记录</button><button data-category="leads">滚动线索</button><button data-category="rolling-events">滚动事件</button><button data-category="recommendations">事件推荐快照</button><button data-category="news">新闻选题</button><button data-category="favorites">收藏</button><div class="divider"></div><button data-category="video">视频</button><button data-category="image">图片</button><button data-category="audio">音频</button><button data-category="source">网页与原文</button><button data-category="text">文字与字幕</button></nav><p class="sidebar-note">素材保存在所属 Project。跨项目使用会创建独立副本，保留原始来源。</p></aside>
<main><section id="schedule-page" hidden></section><section id="recommendation-page" hidden></section><section id="collection-page" hidden></section><section id="stream-page" hidden></section><section id="organization-page" hidden></section><section id="material-page"><p id="research-scope" hidden></p><button id="clear-research-scope" hidden>清除专题／方向筛选</button><form id="search-form" class="filters"><input id="query" type="search" maxlength="200" placeholder="搜索标题、标签、原文或已有转写" aria-label="搜索素材"><button type="submit">搜索</button><select id="project-filter" aria-label="所属 Project"><option value="">全部 Project</option></select><select id="purpose-filter" aria-label="素材用途"><option value="">全部用途</option><option value="unclassified">未分类</option><option value="source">来源素材</option><option value="derived">加工素材</option><option value="preview">预览 / 中间版本</option><option value="work">成品</option><option value="support">辅助记录</option></select><select id="sort" aria-label="排序"><option value="newest">最近保存</option><option value="oldest">最早保存</option><option value="title">标题</option></select><label><input id="archived" type="checkbox">包含归档</label><select id="availability" aria-label="可用状态"><option value="">全部状态</option><option value="saved">已保存</option><option value="missing">文件缺失</option><option value="unverified">待获取 / 核对</option></select><label><input id="support-files" type="checkbox">包含审阅与证明</label><details class="date-filter"><summary>日期范围</summary><select id="date-basis" aria-label="日期类型"><option value="saved">保存日期</option><option value="published">原始发布日期</option></select><label>从<input id="from-date" type="date"></label><label>至<input id="to-date" type="date"></label></details></form><div class="list-heading"><span id="result-count"></span><div><button id="bulk-toggle" aria-pressed="false">批量整理</button><button id="view-grid" aria-pressed="true">卡片</button><button id="view-list" aria-pressed="false">列表</button></div></div><section id="bulk-toolbar" hidden><strong id="bulk-count">已选0份</strong><input id="bulk-tags" maxlength="650" placeholder="要添加的标签，逗号分隔"><button id="bulk-add-tags" data-bulk-action>添加标签</button><button id="bulk-favorite" data-bulk-action>收藏</button><button id="bulk-unfavorite" data-bulk-action>取消收藏</button><button id="bulk-clear" data-bulk-action>清空选择</button></section><p id="library-issues" class="issues"></p><div id="materials" class="materials" aria-label="素材列表"></div><footer class="pagination"><button id="previous">上一页</button><span id="page-label"></span><button id="next">下一页</button></footer></section>
<section id="news-page" hidden><div class="news-heading"><div><h2>新闻选题</h2><p>近72小时 · 最多十题 · 原始来源与真实预览 · 先收集，选定后制作</p></div><button id="news-history">历史批次</button></div><section class="research-controls"><label>本轮研究要求<textarea id="news-instructions" rows="2" maxlength="2000" placeholder="可指定重点、排除已经制作的事件"></textarea></label><div class="research-actions"><button id="news-start" class="primary">推荐新闻选题</button><button id="news-refresh">刷新候选</button><button id="news-close">结束本轮研究</button></div></section><div class="production-options"><label>制作到<select id="news-target"></select></label><p id="news-target-note">使用当前 Project 制作；跨 Project 选题会复制完整来源。</p></div><p id="news-status" role="status"></p><div id="news-batches" hidden></div><div id="news-topics"></div></section></main>
<aside id="details" class="details" aria-label="素材详情"><div class="detail-empty"><span>选择一份素材</span><p>预览内容、核对来源，或复制到当前 Project。</p></div></aside></div><div id="status" role="status" aria-live="polite"></div><script type="module" src="library.js"></script></body></html>
