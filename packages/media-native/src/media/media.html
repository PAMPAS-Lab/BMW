<!doctype html>
<html lang="en">
  <head>

      :root{color-scheme:dark light;font:13px/1.5 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090e15;color:#e9eef5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090e15}#viewer{display:grid;grid-template-rows:auto 1fr;min-height:100vh}#viewer.hidden{display:none}header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid rgba(255,255,255,.12);padding:11px 16px;background:#101722}header strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header span{color:#8e9bad;font-size:11px}main{min-height:0;display:grid;place-items:center;overflow:auto;padding:18px}main img,main video{display:block;max-width:100%;max-height:calc(100vh - 82px);object-fit:contain}main audio{width:min(720px,90vw)}main pre{align-self:stretch;justify-self:stretch;overflow:auto;margin:0;border-radius:10px;background:#0c121b;padding:16px;color:#cbd5e1;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}#output{position:fixed;left:-2px;top:-2px;width:1px;height:1px;opacity:0;pointer-events:none}@media(prefers-color-scheme:light){:root,body{background:#f4f7fa;color:#172033}header{background:#fff;border-color:rgba(15,23,42,.12)}main pre{background:#fff;color:#253047}}
