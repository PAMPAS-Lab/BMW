<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>BMW Assistant</title><link rel="stylesheet" href="./assistant.css"></head>
<body><header><div><strong>BMW Assistant</strong><span id="project"></span></div><select id="driver" aria-label="Agent 驱动"></select><button id="agent-settings-open" title="登录与模型设置">设置</button></header>
<nav><select id="sessions" aria-label="BMW 会话"></select><button id="create" title="新建会话">＋</button><button id="rename" title="重命名">重命名</button><button id="archive" title="归档">归档</button></nav>
<div id="status" role="status"></div><div id="error" role="alert" hidden></div>
<section id="workspace-context"><select id="workspace-mode" aria-label="BMW 工作区模式"><option value="browser">浏览器</option><option value="studio">视频工作区</option></select><span id="studio-context" role="status"></span></section>
<dialog id="rename-dialog"><form method="dialog"><label>会话名称<input id="rename-title" maxlength="200" required></label><footer><button value="cancel">取消</button><button id="rename-save" value="save">保存</button></footer></form></dialog>
<dialog id="agent-settings" aria-labelledby="agent-settings-title"><h2 id="agent-settings-title">Agent 设置</h2><div id="agent-settings-body"><label>Agent 驱动<select id="agent-settings-driver" aria-label="登录设置中的 Agent 驱动"></select></label><p id="agent-auth-state"></p><p id="agent-settings-status" role="status"></p><p id="agent-auth-checked"></p><p id="agent-model-checked"></p><button id="agent-refresh" type="button">刷新状态</button><button id="agent-model-refresh" type="button">刷新模型</button><p>官方读取会同步更新状态与模型；查看和切回已检查的 Agent 使用缓存。</p><section id="agent-model-section"><label>模型<select id="agent-model" aria-label="Agent 模型"></select></label><p id="agent-model-empty" hidden>当前账号没有可选模型，请刷新或切换其他 Agent。</p><button id="agent-model-save" type="button">确认选择</button></section><form id="agent-login"><label>登录方式<select id="agent-login-method"></select></label><div id="agent-login-fields"></div><button id="agent-login-submit" type="submit">登录</button></form><button id="agent-logout" type="button">退出当前引擎登录</button></div><footer><button id="agent-settings-cancel" type="button" hidden>取消操作</button><button id="agent-settings-close" type="button">关闭</button></footer></dialog>
<main id="messages" aria-label="对话消息" aria-live="polite"></main><section id="interactions" aria-label="待回复问题"></section>
<form id="composer"><textarea id="input" aria-label="给 Assistant 的消息" placeholder="让 Assistant 操作当前 Project 的页面和媒体…" rows="3" maxlength="65536"></textarea><footer><span id="queue"></span><button id="recover" type="button" hidden>清理连接</button><button id="stop" type="button">停止</button><button id="send" type="submit">发送</button></footer></form>
<script type="module" src="./assistant.js"></script></body></html>
